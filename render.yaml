services:
  - type: web
    name: marroquineria-peluzza
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: marroquineria-db
          property: connectionString
      # URL pública (callback OAuth + webhook MP + emails)
      - key: PUBLIC_URL
        value: https://marroquineria-peluzza.onrender.com
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USE_TLS
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      # Mercado Pago
      - key: MP_ACCESS_TOKEN
        sync: false
      # Login social (OAuth)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
        # ... variables existentes ...
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_OAUTH_CLIENT_ID
        sync: false
      - key: FACEBOOK_OAUTH_CLIENT_SECRET
        sync: false
      - key: OAUTHLIB_INSECURE_TRANSPORT
        value: "0"

databases:
  - name: marroquineria-db
    databaseName: marroquineria
    plan: free
    region: oregon