<!-- ========================================== -->
<!-- SIDEBAR DE FILTROS                         -->
<!-- ========================================== -->
<aside class="lg:w-64 flex-shrink-0">
    <div class="bg-white rounded-xl shadow-sm p-6 sticky top-24">
        <h3 class="font-display text-xl font-bold text-leather-900 mb-4">Filtros</h3>
        
        <!-- Búsqueda -->
        <div class="mb-6">
            <label class="block text-sm font-semibold text-leather-900 mb-2">Buscar</label>
            <form hx-get="/tienda" hx-target="#product-grid" hx-trigger="input changed delay:300ms" hx-indicator="#search-spinner">
                <input
                    type="text"
                    name="q"
                    value="{{ search }}"
                    placeholder="Ej: billetera, bolso..."
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-craft-600 focus:border-transparent"
                >
                <span id="search-spinner" class="htmx-indicator text-xs text-gray-500 mt-1">Buscando...</span>
            </form>
        </div>

        <!-- Categorías -->
        <div class="mb-6">
            <label class="block text-sm font-semibold text-leather-900 mb-2">Categorías</label>
            <ul class="space-y-2">
                <li>
                    <a href="/tienda"
                       class="block px-3 py-2 rounded-lg text-sm {% if not current_category %}bg-craft-600 text-white font-semibold{% else %}hover:bg-gray-100 text-leather-900{% endif %}">
                        Todas
                    </a>
                </li>
                {% for cat in categories %}
                <li>
                    <a href="/tienda?categoria={{ cat.slug }}&sort={{ current_sort }}{% if search %}&q={{ search }}{% endif %}"
                       class="block px-3 py-2 rounded-lg text-sm {% if current_category == cat.slug %}bg-craft-600 text-white font-semibold{% else %}hover:bg-gray-100 text-leather-900{% endif %}">
                        {{ cat.name }}
                    </a>
                </li>
                {% endfor %}
            </ul>
        </div>

        <!-- Rango de precios -->
        <div class="mb-6">
            <label class="block text-sm font-semibold text-leather-900 mb-2">Precio</label>
            <form hx-get="/tienda" hx-target="#product-grid" hx-trigger="change" class="space-y-2">
                <input type="hidden" name="q" value="{{ search }}">
                <input type="hidden" name="sort" value="{{ current_sort }}">
                {% if current_category %}<input type="hidden" name="categoria" value="{{ current_category }}">{% endif %}
                <div class="flex gap-2">
                    <input type="number" name="min_price" value="{{ min_price or '' }}" placeholder="Min"
                           class="w-1/2 px-2 py-1 border border-gray-300 rounded text-sm">
                    <input type="number" name="max_price" value="{{ max_price or '' }}" placeholder="Max"
                           class="w-1/2 px-2 py-1 border border-gray-300 rounded text-sm">
                </div>
            </form>
        </div>

        <!-- Reset filtros -->
        <a href="/tienda" class="block w-full text-center px-4 py-2 border border-leather-900 text-leather-900 rounded-lg text-sm hover:bg-leather-900 hover:text-white transition">
            Limpiar filtros
        </a>
    </div>
</aside>
