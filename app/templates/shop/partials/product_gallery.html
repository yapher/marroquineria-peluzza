<!-- ========================================== -->
<!-- CARRUSEL DE IMÁGENES DEL PRODUCTO          -->
<!-- Mobile-first con swipe + flechas rojas     -->
<!-- ========================================== -->
<div x-data="productGallery()"
     x-init="init()"
     data-images='[
{% if product.image_url %}
{"url": "{{ product.image_url }}", "alt": "{{ product.name }}"}{% if product.images|length > 0 %},{% endif %}
{% endif %}
{% for img in product.images|sort(attribute='position') %}
{"url": "{{ img.url }}", "alt": "{{ img.alt or product.name }}"}{% if not loop.last %},{% endif %}
{% endfor %}
]'>

    <!-- Imagen principal con transición -->
    <div class="relative aspect-square rounded-2xl overflow-hidden bg-leather-100 mb-3 sm:mb-4 group">
        {% if product.image_url or product.images|length > 0 %}
        <template x-for="(img, index) in images" :key="index">
            <img x-show="current === index"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 :src="img.url"
                 :alt="img.alt"
                 :loading="index === 0 ? 'eager' : 'lazy'"
                 class="absolute inset-0 w-full h-full object-cover select-none"
                 draggable="false">
        </template>

        <!-- ✅ Botones de navegación (flechas ROJAS siempre visibles en móvil) -->
        <template x-if="images.length > 1">
            <div class="absolute inset-0 pointer-events-none">
                <!-- Flecha izquierda -->
                <button @click="prev()"
                        class="gallery-arrow pointer-events-auto absolute left-2 sm:left-3 top-1/2 -translate-y-1/2 w-10 h-10 sm:w-11 sm:h-11 bg-red-600 hover:bg-red-700 text-white rounded-full shadow-xl flex items-center justify-center transition-all duration-200 opacity-90 md:opacity-0 md:group-hover:opacity-100 focus:opacity-100 hover:scale-110 active:scale-95 z-10">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>

                <!-- Flecha derecha -->
                <button @click="next()"
                        class="gallery-arrow pointer-events-auto absolute right-2 sm:right-3 top-1/2 -translate-y-1/2 w-10 h-10 sm:w-11 sm:h-11 bg-red-600 hover:bg-red-700 text-white rounded-full shadow-xl flex items-center justify-center transition-all duration-200 opacity-90 md:opacity-0 md:group-hover:opacity-100 focus:opacity-100 hover:scale-110 active:scale-95 z-10">
                    <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>

                <!-- Contador de imágenes -->
                <div class="pointer-events-auto absolute bottom-2 right-2 sm:bottom-3 sm:right-3 bg-black/60 text-white text-xs px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full font-semibold backdrop-blur-sm z-10">
                    <span x-text="(current + 1) + ' / ' + images.length"></span>
                </div>

                <!-- Dots indicadores -->
                <div class="pointer-events-auto absolute bottom-2 sm:bottom-3 left-1/2 -translate-x-1/2 flex gap-1.5 z-10">
                    <template x-for="(img, index) in images" :key="'dot-' + index">
                        <button @click="goTo(index)"
                                :class="current === index ? 'bg-white w-5' : 'bg-white/50 w-2 hover:bg-white/75'"
                                class="h-2 rounded-full transition-all duration-300 ease-out">
                        </button>
                    </template>
                </div>
            </div>
        </template>

        {% else %}
        <!-- Placeholder si no hay imágenes -->
        <div class="w-full h-full flex items-center justify-center text-7xl sm:text-9xl">
            {% if product.category.slug == 'billeteras' %}👛
            {% elif product.category.slug == 'bolsos' %}👜
            {% elif product.category.slug == 'cinturones' %}🎗️
            {% else %}👜{% endif %}
        </div>
        {% endif %}
    </div>

    <!-- Hint de swipe (solo móvil) -->
    <template x-if="images.length > 1">
        <p class="swipe-hint text-center text-xs text-gray-400 mb-2">
            ← Deslizá para ver más imágenes →
        </p>
    </template>

    <!-- Thumbnails clickeables -->
    <template x-if="images.length > 1">
        <div class="flex gap-2 overflow-x-auto pb-2 snap-x -mx-1 px-1">
            <template x-for="(img, index) in images" :key="'thumb-' + index">
                <button @click="goTo(index)"
                        :class="current === index ? 'ring-2 ring-red-600 ring-offset-1 opacity-100 scale-105' : 'opacity-60 hover:opacity-100'"
                        class="flex-shrink-0 w-14 h-14 sm:w-16 sm:h-16 md:w-20 md:h-20 rounded-lg overflow-hidden transition-all duration-200 snap-start">
                    <img :src="img.url" :alt="img.alt" loading="lazy" class="w-full h-full object-cover">
                </button>
            </template>
        </div>
    </template>
</div>
