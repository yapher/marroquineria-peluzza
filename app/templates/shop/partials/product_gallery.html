<!-- ========================================== -->
<!-- CARRUSEL DE IMÁGENES DEL PRODUCTO          -->
<!-- ========================================== -->
<div x-data="productGallery()"
     x-init="init()"
     data-images='[
        {% if product.image_url %}
        {"url": "{{ product.image_url }}", "alt": "{{ product.name }}"}{% if product.images|length > 0 %},{% endif %}
        {% endif %}
        {% for img in product.images|sort(attribute='position') %}
        {"url": "{{ img.url }}", "alt": "{{ img.alt or product.name }}"}{% if not loop.last %},{% endif %}
        {% endfor %}
     ]'>

    <!-- Imagen principal con transición -->
    <div class="relative aspect-square rounded-2xl overflow-hidden bg-leather-100 mb-4">
        {% if product.image_url or product.images|length > 0 %}
        <template x-for="(img, index) in images" :key="index">
            <!-- La primera imagen NO tiene lazy loading (above the fold) -->
            <img x-show="current === index"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100"
                 x-transition:leave-end="opacity-0"
                 :src="img.url"
                 :alt="img.alt"
                 :loading="index === 0 ? 'eager' : 'lazy'"
                 class="absolute inset-0 w-full h-full object-cover">
        </template>

        <!-- Botones de navegación -->
        <template x-if="images.length > 1">
            <div>
                <!-- Flecha izquierda -->
                <button @click="prev()"
                        class="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/90 hover:bg-white rounded-full shadow-lg flex items-center justify-center transition opacity-0 group-hover:opacity-100 focus:opacity-100">
                    <svg class="w-5 h-5 text-leather-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>

                <!-- Flecha derecha -->
                <button @click="next()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/90 hover:bg-white rounded-full shadow-lg flex items-center justify-center transition opacity-0 group-hover:opacity-100 focus:opacity-100">
                    <svg class="w-5 h-5 text-leather-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>

                <!-- Contador de imágenes -->
                <div class="absolute bottom-3 right-3 bg-black/60 text-white text-xs px-3 py-1.5 rounded-full font-semibold">
                    <span x-text="(current + 1) + ' / ' + images.length"></span>
                </div>
            </div>
        </template>
        {% else %}
        <!-- Placeholder si no hay imágenes -->
        <div class="w-full h-full flex items-center justify-center text-9xl">
            {% if product.category.slug == 'billeteras' %}👛
            {% elif product.category.slug == 'bolsos' %}👜
            {% elif product.category.slug == 'cinturones' %}🎗️
            {% else %}👜{% endif %}
        </div>
        {% endif %}
    </div>

    <!-- Thumbnails clickeables -->
    <template x-if="images.length > 1">
        <div class="flex gap-2 overflow-x-auto pb-2">
            <template x-for="(img, index) in images" :key="index">
                <button @click="current = index"
                        :class="current === index ? 'ring-2 ring-craft-600 opacity-100' : 'opacity-60 hover:opacity-100'"
                        class="flex-shrink-0 w-16 h-16 rounded-lg overflow-hidden transition">
                    <img :src="img.url" :alt="img.alt" loading="lazy" class="w-full h-full object-cover">
                </button>
            </template>
        </div>
    </template>
</div>
