<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Marroquinería Artesanal{% endblock %}</title>
    <meta name="description" content="{% block description %}Productos artesanales de cuero hechos a mano{% endblock %}">

    <!-- Tailwind CSS vía CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        leather: { 50:'#fdf8f3', 100:'#f9ebd9', 700:'#6b3410', 900:'#3d1d08' },
                        craft:   { 500:'#b87333', 600:'#9a5f28' }
                    },
                    fontFamily: {
                        display: ['"Playfair Display"', 'serif'],
                        body:    ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- ✅ ESTILOS PERSONALIZADOS (archivo externo, reemplaza el <style> inline) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

    <!-- HTMX + Alpine.js -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>

    <!-- ✅ CSRF Token para HTMX -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script>
        document.addEventListener('htmx:configRequest', (event) => {
            event.detail.headers['X-CSRFToken'] = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        });
    </script>
</head>
<body class="font-body bg-leather-50 text-leather-900 min-h-screen flex flex-col">

    <!-- Barra de progreso superior -->
    <div id="progress-bar"></div>

    <!-- Overlay de carga global -->
    <div id="global-loader" x-data="{ message: 'Cargando...' }">
        <div class="loader-spinner"></div>
        <p class="loader-text" x-text="message">Cargando...</p>
    </div>

    <!-- ========================================== -->
    <!-- HEADER ORGANIZADO                          -->
    <!-- ========================================== -->

    {% include "partials/header.html" %}

    <!-- ========================================== -->
    <!-- FLASH MESSAGES                             -->
    <!-- ========================================== -->
     
    {% include "partials/flash_messages.html" %}

    <!-- ========================================== -->
    <!-- MAIN CONTENT                               -->
    <!-- ========================================== -->
    <main class="flex-1">
        {% block content %}{% endblock %}
    </main>

    <!-- ========================================== -->
    <!-- FOOTER                                     -->
    <!-- ========================================== -->
    {% include "partials/footer.html" %}

    {% block scripts %}{% endblock %}

    <script>
    (function() {
        const loader = document.getElementById('global-loader');
        const progressBar = document.getElementById('progress-bar');

        // Función helper para mostrar loader
        function showLoader(message = 'Cargando...') {
            if (loader && window.Alpine) {
                Alpine.$data(loader).message = message;
            }
            loader?.classList.add('active');
            progressBar?.classList.add('active');
            progressBar?.classList.remove('complete');
        }

        function hideLoader() {
            loader?.classList.remove('active');
            progressBar?.classList.add('complete');
            setTimeout(() => {
                progressBar?.classList.remove('active', 'complete');
                progressBar.style.width = '0%';
            }, 700);
        }

        // ============================================
        // 1. Loading al cambiar de página (navegación normal)
        // ============================================
        window.addEventListener('beforeunload', function(e) {
            // Solo mostrar si es un enlace normal (no HTMX ni form)
            if (!window._htmxRequest && !window._formSubmitting) {
                showLoader('Cargando página...');
            }
        });

        // ============================================
        // 2. Loading para clicks en enlaces normales
        // ============================================
        document.addEventListener('click', function(e) {
            const link = e.target.closest('a[href]');
            if (!link) return;
            const href = link.getAttribute('href');
            // Ignorar: anchors, javascript:, HTMX (ya tiene su propio loading), enlaces externos
            if (!href ||
                href.startsWith('#') ||
                href.startsWith('javascript:') ||
                link.hasAttribute('hx-get') ||
                link.hasAttribute('hx-post') ||
                link.hasAttribute('hx-delete') ||
                link.hasAttribute('hx-put') ||
                link.getAttribute('target') === '_blank' ||
                href.startsWith('http') && !href.includes(window.location.hostname)) {
                return;
            }
            showLoader('Cargando página...');
        });

        // ============================================
        // 3. Loading para formularios
        // ============================================
        document.addEventListener('submit', function(e) {
            const form = e.target;
            if (form.hasAttribute('hx-post') || form.hasAttribute('hx-get')) return; // HTMX maneja su propio loading
            form.classList.add('submitting');
            window._formSubmitting = true;
            showLoader('Procesando...');
        });

        // ============================================
        // 4. Loading para peticiones HTMX
        // ============================================
        document.addEventListener('htmx:beforeRequest', function(e) {
            window._htmxRequest = true;
            // Solo mostrar loader si es una petición importante (no búsqueda en tiempo real)
            const target = e.detail.elt;
            if (!target.hasAttribute('hx-trigger') || !target.getAttribute('hx-trigger').includes('keyup')) {
                progressBar?.classList.add('active');
            }
        });

        document.addEventListener('htmx:afterRequest', function(e) {
            window._htmxRequest = false;
            progressBar?.classList.remove('active');
            progressBar?.classList.add('complete');
            setTimeout(() => progressBar?.classList.remove('complete'), 700);
        });

        document.addEventListener('htmx:responseError', function(e) {
            window._htmxRequest = false;
            hideLoader();
        });

        // ============================================
        // 5. Loading al cargar la página
        // ============================================
        window.addEventListener('load', function() {
            hideLoader();
            window._formSubmitting = false;
        });

        // ============================================
        // 6. Función global para usar desde botones
        // ============================================
        window.showGlobalLoader = showLoader;
        window.hideGlobalLoader = hideLoader;
    })();
    </script>
</body>
</html>
